name: picture360
description: A Flutter app to capture 360-degree panoramic photos and export as equirectangular PNG.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  sensors_plus: ^6.1.0
  opencv_dart: ^2.2.2
  panorama_image: 0.0.1
  permission_handler: ^13.0.1
  path_provider: ^2.1.6
  gal: ^2.3.3
  image: ^4.3.0
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
